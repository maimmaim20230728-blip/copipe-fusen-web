<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="0.3.0">
<meta name="theme-color" content="#2EAD62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クリップメモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon32.png">
<title>便利クリップメモ・そよぎ</title>
<style>html, body { margin: 0; padding: 0; background: #f2f6f3; }</style>
</head>
<body>
<script>
/* Web版アダプタ: 拡張の background.js に相当する部分を localStorage で実装する。
   UI(content.js)とロジック(store_logic.js)は拡張本体と共用(_sync_web.jsで同期)。
   データはこの端末のブラウザ内にのみ保存され、外部送信は一切ない。 */
window.__SOYOGI_FUSEN_WEB = true;
(function () {
  var KEY = 'benri-clip-memo-web';
  var msgListeners = [];
  var changeListeners = [];
  /* 保存できなかったとき(容量いっぱい・保存が使えない状態)に画面へ出す文言 */
  /* 言語は画面の言語ボタンで選んだもの(uiLang)を優先し、無ければブラウザの言語 */
  function saveFailMsg() {
    var lang = readStore().uiLang;
    if (lang !== 'ja' && lang !== 'en') {
      lang = /^ja\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'ja') ? 'ja' : 'en';
    }
    return lang === 'ja'
      ? '保存できませんでした。保存できる量がいっぱいの可能性があります。いらない項目を消してから、もう一度お試しください'
      : 'Could not save. Storage may be full. Please delete items you do not need and try again';
  }

  /* 🔴 Web版を2つ開いても、片方が古い中身で丸ごと上書きしないよう、
        中身をメモリに持たず、読むときも書く直前も毎回 localStorage から読み直す */
  function readStore() {
    try {
      var saved = localStorage.getItem(KEY);
      var obj = saved ? JSON.parse(saved) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    } catch (e) { return {}; }
  }

  function notify(changes) {
    setTimeout(function () {
      changeListeners.forEach(function (f) { f(changes, 'local'); });
    }, 0);
  }

  /* 書く直前に読み直して、変えるキーだけ差し替えて書く。書けなかったら false(画面は変えない) */
  function applySet(obj) {
    var store = readStore();
    var changes = {};
    Object.keys(obj).forEach(function (k) {
      changes[k] = { oldValue: store[k], newValue: obj[k] };
      store[k] = obj[k];
    });
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch (e) {
      return false;
    }
    notify(changes);
    return true;
  }

  /* もう1つのWeb版(別のタブ・窓)が書いたら、こちらの画面も描き直す */
  window.addEventListener('storage', function (e) {
    if (e.key !== null && e.key !== KEY) return;
    var before = {};
    try { before = e.oldValue ? (JSON.parse(e.oldValue) || {}) : {}; } catch (err) {}
    var after = readStore();
    var changes = {};
    ['clips', 'memos'].forEach(function (k) {
      if (JSON.stringify(before[k]) !== JSON.stringify(after[k])) {
        changes[k] = { oldValue: before[k], newValue: after[k] || [] };
      }
    });
    if (Object.keys(changes).length) notify(changes);
  });

  /* 拡張background.jsのhandleOpと同じ内容。
     🔴 addClip/addMemoの保存先はop名で固定(msg.kind判定にしない) */
  function handleOp(msg) {
    var L = window.SoyogiFusenLogic;
    var now = Date.now();
    var store = readStore();
    var kind = msg.kind === 'memo' ? 'memo' : 'clip';
    var key = kind === 'memo' ? 'memos' : 'clips';
    if (msg.op === 'addClip') key = 'clips';
    if (msg.op === 'addMemo') key = 'memos';
    var list = store[key] || [];
    var next = list;
    switch (msg.op) {
      case 'addClip': next = L.addClip(list, msg.text, now); break;
      case 'addMemo': next = L.addMemo(list, msg.text || '', msg.opts, now); break;
      case 'updateText': next = L.updateItem(list, msg.id, { text: L.clampText(msg.text) }, true, now); break;
      case 'setColor': next = L.updateItem(list, msg.id, { color: msg.color }, false, now); break;
      case 'setTextColor': next = L.updateItem(list, msg.id, { textColor: msg.textColor }, false, now); break;
      case 'togglePin':
        next = list.map(function (it) {
          return it.id === msg.id ? Object.assign({}, it, { pinned: !it.pinned }) : it;
        });
        break;
      case 'remove': next = L.removeItem(list, msg.id); break;
      /* 「元に戻す」。消した項目を同じ id・文字・色・ピン・ts・pos で戻す(拡張と同じ) */
      case 'restore': next = L.restoreItem(list, msg.item, kind === 'memo' ? 'yellow' : 'white', now); break;
      case 'setOrder': next = L.applyManualOrder(list, msg.ids); break;
      case 'importItems': {
        /* clipsとmemosを1回の書き込みでまとめて足す(拡張のbackground.jsと同じ) */
        var rc = L.mergeItems(store.clips || [], msg.clips || [], now);
        var rm = L.mergeItems(store.memos || [], msg.memos || [], now);
        if (!applySet({ clips: rc.list, memos: rm.list })) return { ok: false, message: saveFailMsg() };
        return {
          ok: true, addedClips: rc.added, addedMemos: rm.added,
          skipped: rc.skipped + rm.skipped, dropped: rc.dropped + rm.dropped
        };
      }
    }
    var patch = {};
    patch[key] = next;
    /* 🔴 書けなかったことを握りつぶさない(content.js が下書きを残して文言を出す) */
    if (!applySet(patch)) return { ok: false, message: saveFailMsg() };
    return { ok: true };
  }

  window.chrome = {
    runtime: {
      onMessage: { addListener: function (f) { msgListeners.push(f); } },
      sendMessage: function (msg) {
        if (msg && msg.type === 'soyogi-fusen-op') {
          return Promise.resolve(handleOp(msg));
        }
        if (msg && msg.type === 'soyogi-fusen-read-clipboard') {
          /* ボタンタップの流れの中で直接readTextを呼ぶ(iPadはここで貼り付け確認が出る) */
          if (navigator.clipboard && navigator.clipboard.readText) {
            return navigator.clipboard.readText().then(
              function (t) { return { ok: true, text: t }; },
              function () { return { ok: false, text: '' }; }
            );
          }
          return Promise.resolve({ ok: false, text: '' });
        }
        return Promise.resolve({ ok: true });
      },
      getURL: function (p) { return p; }
    },
    storage: {
      local: {
        get: function (defaults, cb) {
          var store = readStore();
          var res = Object.assign({}, defaults);
          Object.keys(store).forEach(function (k) { res[k] = store[k]; });
          setTimeout(function () { cb(res); }, 0);
        },
        set: function (obj, cb) {
          var ok = applySet(obj);
          if (cb) setTimeout(cb, 0);
          return ok ? Promise.resolve() : Promise.reject(new Error(saveFailMsg()));
        }
      },
      onChanged: { addListener: function (f) { changeListeners.push(f); } }
    },
    windows: { getCurrent: function (cb) { cb(null); } }
  };
})();
</script>
<script src="./store_logic.js"></script>
<script src="./content.js"></script>
<script>
/* Web版だけの上余白(拡張の content.js と同期で消えないよう、ここで足す)。
   iPhoneのカメラ(ノッチ)のそばで見えない・押せない部分が出ないよう、上のバーの上の余白を
   10px→18px にする。ノッチ分(env(safe-area-inset-top))は content.js 側のパネルに入っている。
   中身は shadow DOM なので、ホストができたら style を足す(作り直されても足し直す) */
(function () {
  var CSS = '.panel.page-mode .hdr { padding-top: 18px; }' +
    '@container (max-width: 330px) { .panel.page-mode .hdr { padding-top: 15px; } }';
  function patch() {
    var host = document.getElementById('soyogi-fusen-host');
    var sr = host && host.shadowRoot;
    if (!sr || sr.querySelector('style[data-web-topgap]')) return;
    var st = document.createElement('style');
    st.setAttribute('data-web-topgap', '1');
    st.textContent = CSS;
    sr.appendChild(st);
  }
  new MutationObserver(patch).observe(document.documentElement, { childList: true, subtree: true });
  patch();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}
</script>
</body>
</html>
